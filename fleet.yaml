---
name: nginx
defaultNamespace: default
downstreamResources:
  - kind: Secret
    name: test-secret-fleet-ns
    namespace: fleet-default
helm:
  chart: bitnami/nginx
  releaseName: nginx
  repo: https://charts.bitnami.com/bitnami
  values:
    revisionHistoryLimit: 9
  valuesFrom:
    - secretKeyRef:
        name: test-secret-fleet-ns
        key: values.yaml
        namespace: fleet-default
