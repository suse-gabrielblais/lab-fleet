---
name: nginx
defaultNamespace: default
downstreamResources:
  - kind: Secret
    name: test-secret-fleet-ns
    namespace: fleet-default
helm:
  chart: nginx
  releaseName: nginx
  repo: https://charts.bitnami.com/bitnami
  values:
    revisionHistoryLimit: 9
    service.type: "ClusterIP"
  valuesFrom:
    - secretKeyRef:
        name: test-secret-fleet-ns
        key: values.yaml
        namespace: fleet-default
