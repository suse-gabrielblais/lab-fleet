---
name: harbor
defaultNamespace: default
downstreamResources:
  - kind: Secret
    name: test-secret-fleet-ns
helm:
  chart: harbor
  releaseName: harbor
  repo: https://helm.goharbor.io
  values:
    logLevel: "warning"
  valuesFrom:
    - secretKeyRef:
        name: test-secret-fleet-ns
        key: values.yaml
