---
name: grafana
defaultNamespace: default
downstreamResources:
  - kind: Secret
    name: test-secret
helm:
  chart: grafana
  releaseName: grafana
  repo: https://grafana-community.github.io/helm-charts
  values:
    env:
      ENVIRONMENT: lab
  valuesFrom:
    - secretKeyRef:
        name: test-secret
        key: values.yaml
        namespace: default
